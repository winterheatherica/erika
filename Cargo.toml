[package]
name = "erika"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.30"
egui = "0.30"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
earcutr = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
